services:
  app:
    platform: linux/arm64
    container_name: domus-hub
    image: "kappa9/docker-hub:1.0.0"
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/domus_hub
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASS}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: domus-hub-kafka:19092
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL}
      DEVICE_LIGHT_LIVING_ROOM: ${DEVICE_LIGHT_LIVING_ROOM}
    depends_on:
      - postgres
      - kafka
